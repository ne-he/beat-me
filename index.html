<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Beat Nemi 💘 — Game Spesial LDR</title>
  <meta name="description" content="Game pukul-pukulan paling romantis sedunia. Hajar bosnya sampai ngaku cinta!">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👊</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <canvas id="game"></canvas>

  <!-- ============ HUD ============ -->
  <div id="hud">
    <div class="topbar">
      <div class="card hp-card">
        <div class="hp-head">
          <span id="hp-label">💅 Ketahanan Ego</span>
          <span id="phase-label">Sok Cool 😎</span>
        </div>
        <div class="hp-track">
          <div id="hp-fill"></div>
          <span id="hp-num">300 / 300</span>
        </div>
      </div>
      <div class="top-right">
        <div id="combo-card" class="card combo-card hidden">
          <span id="combo-num">x0</span>
          <span class="combo-word">COMBO 🔥</span>
        </div>
        <button id="btn-mute" class="icon-btn" title="Suara (M)">🔊</button>
        <button id="btn-restart" class="icon-btn" title="Ulang (R)">🔄</button>
      </div>
    </div>

    <div class="bottombar">
      <button id="btn-ult" class="ult-btn" disabled>
        <div id="ult-fill"></div>
        <span id="ult-label">🤗 PELUKAN MAUT</span>
      </button>
      <div id="toolbar" class="card toolbar"></div>
    </div>
  </div>

  <!-- ============ TITLE SCREEN ============ -->
  <div id="title-overlay" class="overlay">
    <div class="title-box">
      <div class="title-emoji">👊😵</div>
      <h1 id="game-title" class="game-title">BEAT NEMI</h1>
      <p id="subtitle"></p>
      <button id="btn-start" class="big-btn">MULAI HAJAR 👊</button>
      <label class="upload-label">
        📸 Pakai foto lain
        <input type="file" id="face-upload" accept="image/*">
      </label>
      <p class="hint">
        Tap muka = pukul &nbsp;·&nbsp; Tahan &amp; seret = lempar 🌀<br>
        Tombol 1-5 ganti senjata &nbsp;·&nbsp; Isi bar 🤗 buat Pelukan Maut
      </p>
    </div>
  </div>

  <!-- ============ WIN SCREEN ============ -->
  <div id="win-overlay" class="overlay hidden">
    <div class="win-box">
      <h2>🏆 MENANG!</h2>
      <p id="win-quote"></p>
      <div id="win-stats" class="stats"></div>
      <button id="btn-again" class="big-btn">MAIN LAGI 💖</button>
      <p class="hint">Screenshot hasilnya &amp; kirim ke doi 😝</p>
    </div>
  </div>

  <!-- ============ SCRIPTS (urutan penting) ============ -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/popups.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/boss.js"></script>
  <script src="js/weapons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
